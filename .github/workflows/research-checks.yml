name: Public research checks
on:
  push:
    paths: ['research/**', 'presentation/**', 'research-release.json', '.github/workflows/research-checks.yml']
  pull_request:
    paths: ['research/**', 'presentation/**', 'research-release.json', '.github/workflows/research-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/2026-10-public-data/verify.py
      - run: python research/2026-10-public-data/release_check.py
      - run: python -m pip install uv==0.8.22
      - run: uv run research/2026-10-public-data/test_analysis.py
